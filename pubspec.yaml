name: profit_from_it_investors
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.5+7


environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  flutter_rating_bar: ^4.0.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  image_picker: ^1.2.2
  video_player: ^2.11.1
  fl_chart: ^1.2.0
  lottie: ^3.3.3
  shimmer: ^3.0.0
  flutter_local_notifications: ^21.0.0
  connectivity_plus: ^7.1.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  timezone: ^0.11.0
  fluttertoast: ^9.0.0
  google_fonts: ^8.1.0
  flutter_screenutil: ^5.9.3
  flutter_otp_text_field: ^1.5.1+1
  modal_progress_hud_nsn: ^0.5.1
  package_info_plus: ^9.0.1
  path: ^1.9.1
  image_cropper: ^12.2.1
  flutter_image_compress: ^2.4.0
  font_awesome_flutter: ^11.0.0
  syncfusion_flutter_charts: ^33.2.7
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/image/png/
    - assets/image/svg/
    - assets/image/json/

  fonts:
    - family: SF-Pro-Bold
      fonts:
        - asset: assets/font/sf-pro-bold.otf
    - family: SF-Pro-Regular
      fonts:
        - asset: assets/font/sf-pro-regular.otf

    - family: Vazir-Bold
      fonts:
        - asset: assets/font/vazir-bold.ttf
    - family: Vazir-Regular
      fonts:
        - asset: assets/font/vazir-regular.ttf